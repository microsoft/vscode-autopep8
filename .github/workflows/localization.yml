name: Localization

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - package.nls.json
      - src/**/*.ts
      - .github/workflows/localization.yml

permissions:
  contents: read

concurrency:
  group: localization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  localization:
    if: github.repository == 'microsoft/vscode-autopep8'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: microsoft/vscode-python-ci/actions/localization@f078b68e968b56e0a22d6cf803bb241a6b094994
        with:
          app-id: ${{ vars.PYTHON_LOCALIZATION_APP_ID }}
          private-key: ${{ secrets.PYTHON_LOCALIZATION_PRIVATE_KEY }}
